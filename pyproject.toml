[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figma2pptx"
version = "1.0.0"
description = "Převod Figma snímků/rámců do editovatelného PPTX (barvy, gradienty, texty, obrázky, vektory)"
requires-python = ">=3.9"
dependencies = ["python-pptx>=1.0", "requests>=2.28", "Pillow>=10", "numpy>=1.24", "lxml>=4.9"]

[project.scripts]
figma2pptx = "figma2pptx.cli:main"
figma2pptx-web = "figma2pptx.web:main"

[tool.setuptools]
packages = ["figma2pptx"]
